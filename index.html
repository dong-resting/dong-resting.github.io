<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面走丢了</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      padding: 24px;
    }

    .container {
      text-align: center;
      max-width: 480px;
    }

    .code {
      font-size: clamp(96px, 24vw, 160px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    h1 {
      margin-top: 16px;
      font-size: 22px;
      font-weight: 600;
      color: #f1f5f9;
    }

    p {
      margin-top: 12px;
      font-size: 15px;
      line-height: 1.7;
      color: #94a3b8;
    }

    .actions {
      margin-top: 32px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a {
      display: inline-block;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: #38bdf8;
      color: #0f172a;
    }

    .btn-primary:hover {
      background: #7dd3fc;
      transform: translateY(-1px);
    }

    .btn-ghost {
      border: 1px solid #334155;
      color: #cbd5e1;
    }

    .btn-ghost:hover {
      border-color: #64748b;
      background: #1e293b;
      transform: translateY(-1px);
    }

    .hint {
      margin-top: 40px;
      font-size: 12px;
      color: #475569;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="code">404</div>
    <h1>页面走丢了</h1>
    <p>你访问的页面不存在，可能已被移动、删除，或者链接本身有误。</p>

    <div class="actions">
      <a class="btn-primary" href="/">返回首页</a>
      <a class="btn-ghost" href="javascript:history.back()">返回上一页</a>
    </div>

    <p class="hint">如果你认为这是一个错误，请联系站点管理员。</p>
  </main>
</body>
</html>
